name = "raetsel"
main = "src/index.tsx"
compatibility_date = "2026-09-01"

# Rätsel, Texte, Wörter und (ab Phase 2) Spielstände/Statistik
[[d1_databases]]
binding = "DB"
database_name = "raetsel"
database_id = "b3f337a4-51e7-42ab-acbe-6b7c84dea625"
migrations_dir = "migrations"

# Logos
[[r2_buckets]]
binding = "FILES"
bucket_name = "raetsel-files"

[vars]
# Cloudflare Access fürs Backend (/admin). Beide leer = kein Schutz (nur lokal!).
# ACCESS_TEAM_DOMAIN z.B. "tsri.cloudflareaccess.com", ACCESS_AUD = Application Audience (AUD) Tag
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

# Statische Dateien des Spiels (public/static/*); alles andere geht an den Worker
[assets]
directory = "./public"
